pre-commit:
  parallel: true
  commands:
    # 1. Format code with Prettier and Next.js Lint (Excludes public folder)
    frontend-formatting:
      glob: "*.{js,jsx,ts,tsx,css,md}"
      exclude: "^public/"
      run: npx prettier --write {staged_files} && npx next lint --file {staged_files}

    # 2. Check-json & check-yaml by checking syntax natively
    syntax-check:
      glob: "*.{json,yaml,yml}"
      run: npx prettier --check {staged_files}

    # 3. Check-merge-conflict
    merge-conflicts:
      run: git diff --check | grep -E '^\+\+\+|^@@' -v | grep -E '<<<<<<<|=======|>>>>>>>' && exit 1 || exit 0

    # 4. Detect-private-key using a native Node security scanner
    private-keys:
      glob: "*"
      run: npx secretlint {staged_files}

    # 5. Check-added-large-files (Blocks files over 500KB)
    large-files:
      glob: "*"
      exclude: "^public/"
      run: |
        for file in {staged_files}; do
          if [ -f "$file" ] && [ $(wc -c < "$file") -gt 512000 ]; then
            echo "Error: $file is larger than 500KB. Commit blocked."
            exit 1
          fi
        done
